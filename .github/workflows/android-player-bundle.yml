name: Android Player bundle

# Builds the Clarity Player Android App Bundle (.aab) for Google Play.
#
#   Run workflow (manual)  signed bundle, uploaded as a workflow artifact
#   Pull request           unsigned bundle, just to prove the build still works
#
# Signing uses the Play upload key, held as four repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/android-player-bundle.yml
      - source/android/**
      - source/capacitor.config.ts
      - source/scripts/sync-app-version.mjs

permissions:
  contents: read

concurrency:
  group: android-player-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The versionCode is the commit count; a shallow clone would count 1.
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the app web bundle
        run: npm run build:app

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Restore the upload key
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set, so the bundle cannot be signed for Play."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the release bundle
        working-directory: source/android
        run: ./gradlew --no-daemon bundleRelease

      - name: Name the bundle after its version
        id: bundle
        run: |
          . android/app/version.properties
          name="clarity-player-${VERSION_NAME}-${VERSION_CODE}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            name="$name-unsigned"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: source/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
