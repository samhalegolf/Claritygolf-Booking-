name: Repair and build Optix integration

on:
  push:
    branches:
      - fix/optix-build-errors

permissions:
  contents: write

concurrency:
  group: repair-optix-build
  cancel-in-progress: false

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/optix-build-errors
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Restore valid App and mount native Optix panel
        shell: bash
        run: |
          git show 3ae33c3d38c5189dd2ce377fcdfa6670fb42931e:source/src/App.tsx > source/src/App.tsx
          python3 <<'PY'
          from pathlib import Path

          path = Path("source/src/App.tsx")
          source = path.read_text()

          import_anchor = 'import { activeCurrency, activeLocale } from "../netlify/functions/_shared/locale.mts";\n'
          optix_import = 'import OptixIntegrationPanel from "./modules/optix/OptixIntegrationPanel";\n'
          if optix_import not in source:
              if import_anchor not in source:
                  raise SystemExit("Optix import anchor was not found")
              source = source.replace(import_anchor, import_anchor + optix_import, 1)

          grid_anchor = '            <div className={`settings-grid settings-tab-${settingsTab}`}>\n'
          optix_mount = '              {settingsTab === "integrations" ? <OptixIntegrationPanel /> : null}\n'
          if optix_mount not in source:
              if grid_anchor not in source:
                  raise SystemExit("Integrations settings grid anchor was not found")
              source = source.replace(grid_anchor, grid_anchor + optix_mount, 1)

          path.write_text(source)
          PY

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build
        working-directory: source
        run: npm run build

      - name: Commit repaired App
        shell: bash
        run: |
          if git diff --quiet -- source/src/App.tsx; then
            echo "App.tsx is already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- source/src/App.tsx
          git commit -m "Restore App and mount native Optix settings"
          git push origin HEAD:fix/optix-build-errors
