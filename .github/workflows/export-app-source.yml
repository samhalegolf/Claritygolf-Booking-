name: Export app source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: app-source
          path: |
            source/src/App.tsx
            source/src/styles.css
            source/netlify/functions/calendar-state.mts
            source/netlify/functions/external-bookings.mts
            source/netlify/functions/_shared/optix-origin.mts
          if-no-files-found: error
