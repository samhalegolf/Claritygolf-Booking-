name: Export app source

on:
  push:
    branches:
      - fix/optix-origin-badge-name

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: app-source
          path: |
            source/src/App.tsx
            source/src/styles.css
          if-no-files-found: error
