# The only Netlify config. Functions declare their own routes in code
# (`export const config = { path }`), and booking-api's /api/* catch-all lists
# every one of them in excludedPath (src/uiRules.test.ts checks this), so no
# /api redirects are needed here.

[build]
  base = "source"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "24"
