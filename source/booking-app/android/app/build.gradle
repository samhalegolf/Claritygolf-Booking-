apply plugin: 'com.android.application'

// versionName and versionCode come from ../../scripts/sync-app-version.mjs,
// which every `npm run native:*` script runs first: package.json "version"
// and the git commit count, the same two numbers the iOS build uses. No
// fallback -- a default versionCode would be rejected by Play, or worse,
// collide with a real one.
def appVersion = new Properties()
def appVersionFile = file('version.properties')
if (!appVersionFile.exists()) {
    throw new GradleException("booking-app/android/app/version.properties is missing. Run `npm run native:sync` in booking-app/ first.")
}
appVersionFile.withInputStream { appVersion.load(it) }

// Upload-key signing for release bundles, read from android/keystore.properties
// (local, gitignored -- copy keystore.properties.example) or from the four
// ANDROID_KEYSTORE_* variables (CI sets them from repository secrets). The
// file wins where both say something. With neither, the release comes out
// unsigned: fine for proving it builds, refused by Play. The build log and the
// file name scripts/native-release.mjs writes both say which you got.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String propertyKey, String envKey ->
    def fromFile = keystoreProperties.getProperty(propertyKey)
    if (fromFile != null && !fromFile.trim().isEmpty()) return fromFile.trim()
    def fromEnv = System.getenv(envKey)
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    return null
}
def releaseKeystore = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')
def releaseStorePassword = signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')

android {
    namespace = "app.claritygolf.booking"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.claritygolf.booking"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersion.getProperty('VERSION_CODE').toInteger()
        versionName appVersion.getProperty('VERSION_NAME')
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Printed so the number that goes to Play is in the build log rather than
// something to dig for after an upload is refused.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i).*(assemble|bundle)Release.*/
    }
    if (buildingRelease) {
        def signedWith = releaseKeystore ? "signed with ${releaseKeystore}" : "UNSIGNED (Play will refuse it)"
        logger.lifecycle("Clarity Booking release: versionCode ${appVersion.getProperty('VERSION_CODE')}, versionName ${appVersion.getProperty('VERSION_NAME')}, ${signedWith}")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
