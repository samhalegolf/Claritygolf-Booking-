<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Clarity Booking</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: -apple-system, system-ui, sans-serif;
        text-align: center;
      }
      button { font: inherit; padding: 12px 20px; border-radius: 10px; border: 1px solid currentColor; background: none; color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach Clarity</h1>
      <p>Check this iPhone has Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.replace('https://claritygolf.app')">Try again</button>
    </main>
  </body>
</html>
